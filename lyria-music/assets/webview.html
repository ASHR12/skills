<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyria Music Player</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap"
    />
    <style>
      :root {
        --amber: #f59e0b;
        --amber-light: #fbbf24;
        --amber-glow: rgba(245, 158, 11, 0.25);
        --surface: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.08);
        --text: #fafaf9;
        --text-dim: #a8a29e;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: linear-gradient(160deg, #1c1917 0%, #0c0a09 50%, #1a0f00 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--text);
        overflow: hidden;
      }

      .player {
        width: 360px;
        background: var(--surface);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 32px 28px 28px;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: slideUp 0.6s ease-out;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .viz {
        width: 100%;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        margin-bottom: 24px;
        opacity: 0.4;
        transition: opacity 0.4s;
      }

      .playing .viz { opacity: 1; }

      .viz-bar {
        width: 4px;
        border-radius: 2px;
        background: var(--amber);
        height: 8px;
        transition: height 0.15s ease;
      }

      .playing .viz-bar {
        animation: vizBounce 0.8s ease-in-out infinite alternate;
      }

      @keyframes vizBounce {
        0% { height: 8px; opacity: 0.4; }
        100% { height: var(--bar-h, 60px); opacity: 1; }
      }

      .loading .viz-bar {
        animation: loadPulse 1.4s ease-in-out infinite;
      }

      @keyframes loadPulse {
        0%, 100% { height: 8px; opacity: 0.3; }
        50% { height: var(--bar-h, 40px); opacity: 0.7; }
      }

      .info {
        text-align: center;
        margin-bottom: 20px;
        width: 100%;
      }

      .info h1 {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.3;
        margin-bottom: 6px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .info .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 500;
        color: var(--amber);
        background: var(--amber-glow);
        padding: 3px 10px;
        border-radius: 20px;
        letter-spacing: 0.5px;
      }

      .lyrics-box {
        width: 100%;
        max-height: 100px;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.6;
        color: var(--text-dim);
        background: rgba(0, 0, 0, 0.2);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 20px;
        white-space: pre-wrap;
        scrollbar-width: thin;
        scrollbar-color: var(--amber) transparent;
      }

      .lyrics-box:empty { display: none; }

      .progress-wrap {
        width: 100%;
        margin-bottom: 20px;
      }

      .progress-track {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 3px;
        cursor: pointer;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--amber), var(--amber-light));
        border-radius: 3px;
        transition: width 0.15s linear;
      }

      .time-row {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text-dim);
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .btn-play {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--amber);
        border: none;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        box-shadow: 0 8px 24px var(--amber-glow);
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .btn-play:hover {
        transform: scale(1.06);
        box-shadow: 0 12px 32px var(--amber-glow);
      }

      .btn-play:active { transform: scale(0.94); }

      .btn-play svg {
        fill: #1c1917;
        width: 26px;
        height: 26px;
      }

      .btn-play.disabled {
        opacity: 0.3;
        pointer-events: none;
      }

      .status-msg {
        text-align: center;
        font-size: 13px;
        color: var(--text-dim);
        margin-top: 16px;
      }

      .status-msg.error { color: #ef4444; }
    </style>
  </head>

  <body>
    <div class="player" id="player">
      <div class="viz" id="viz"></div>

      <div class="info">
        <h1 id="title">Generating music...</h1>
        <span class="badge">LYRIA 3 CLIP &middot; 30s</span>
      </div>

      <div class="lyrics-box" id="lyrics"></div>

      <div class="progress-wrap">
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="time-row">
          <span id="cur-time">0:00</span>
          <span id="tot-time">0:30</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn-play disabled" id="btn-play">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" id="icon-path" /></svg>
        </button>
      </div>

      <div class="status-msg" id="status">Calling Lyria 3 API...</div>
    </div>

    <audio id="audio"></audio>

    <script>
      var params = new URLSearchParams(window.location.search);
      var promptText = params.get("prompt") || "Generated Clip";
      var apiKey = decodeURIComponent(window.location.hash.substring(1));

      var player = document.getElementById("player");
      var titleEl = document.getElementById("title");
      var lyricsEl = document.getElementById("lyrics");
      var statusEl = document.getElementById("status");
      var playBtn = document.getElementById("btn-play");
      var iconPath = document.getElementById("icon-path");
      var audio = document.getElementById("audio");
      var progressTrack = document.getElementById("progress-track");
      var progressFill = document.getElementById("progress-fill");
      var curTimeEl = document.getElementById("cur-time");
      var totTimeEl = document.getElementById("tot-time");
      var vizContainer = document.getElementById("viz");

      var BAR_COUNT = 40;
      for (var i = 0; i < BAR_COUNT; i++) {
        var bar = document.createElement("div");
        bar.className = "viz-bar";
        var h = 12 + Math.random() * 52;
        bar.style.setProperty("--bar-h", h + "px");
        bar.style.animationDelay = (Math.random() * 0.6).toFixed(2) + "s";
        bar.style.animationDuration = (0.5 + Math.random() * 0.5).toFixed(2) + "s";
        vizContainer.appendChild(bar);
      }

      titleEl.textContent = promptText.length > 80
        ? promptText.substring(0, 77) + "..."
        : promptText;

      player.classList.add("loading");

      generateMusic();

      async function generateMusic() {
        if (!apiKey) {
          showError("Missing API key.");
          return;
        }

        try {
          statusEl.textContent = "Generating your clip... (15-30 seconds)";

          var url =
            "https://generativelanguage.googleapis.com/v1beta/models/lyria-3-clip-preview:generateContent?key=" +
            encodeURIComponent(apiKey);

          var requestBody = {
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: {
              responseModalities: ["AUDIO", "TEXT"],
            },
          };

          var response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody),
          });

          if (!response.ok) {
            var errBody = await response.text();
            var msg = "API error " + response.status;
            try {
              var errJson = JSON.parse(errBody);
              if (errJson.error && errJson.error.message) msg = errJson.error.message;
            } catch (_) {}
            throw new Error(msg);
          }

          var result = await response.json();

          if (!result.candidates || result.candidates.length === 0) {
            throw new Error("No response. Prompt may have been filtered by safety checks.");
          }

          var lyrics = "";
          var audioBase64 = "";
          var audioMime = "audio/mp3";

          for (var j = 0; j < result.candidates[0].content.parts.length; j++) {
            var part = result.candidates[0].content.parts[j];
            if (part.text) {
              lyrics += part.text + "\n";
            } else if (part.inlineData) {
              audioBase64 = part.inlineData.data;
              audioMime = part.inlineData.mimeType || "audio/mp3";
            }
          }

          if (!audioBase64) {
            throw new Error("No audio generated. Try a different prompt.");
          }

          audio.src = "data:" + audioMime + ";base64," + audioBase64;

          if (lyrics.trim()) {
            lyricsEl.textContent = lyrics.trim();
          }

          player.classList.remove("loading");
          playBtn.classList.remove("disabled");
          statusEl.textContent = "Ready — tap play to listen";

        } catch (e) {
          showError(e.message);
        }
      }

      function showError(msg) {
        player.classList.remove("loading");
        statusEl.textContent = msg;
        statusEl.classList.add("error");
        titleEl.textContent = "Generation Failed";
      }

      playBtn.addEventListener("click", function () {
        if (audio.paused) {
          audio.play().then(function () {
            player.classList.add("playing");
            iconPath.setAttribute("d", "M6 19h4V5H6v14zm8-14v14h4V5h-4z");
            statusEl.textContent = "Now Playing";
            statusEl.classList.remove("error");
          }).catch(function (e) {
            statusEl.textContent = "Playback error";
            statusEl.classList.add("error");
          });
        } else {
          audio.pause();
          player.classList.remove("playing");
          iconPath.setAttribute("d", "M8 5v14l11-7z");
          statusEl.textContent = "Paused";
        }
      });

      audio.addEventListener("timeupdate", function () {
        if (!audio.duration) return;
        var pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + "%";
        curTimeEl.textContent = fmt(audio.currentTime);
      });

      audio.addEventListener("loadedmetadata", function () {
        totTimeEl.textContent = fmt(audio.duration);
      });

      progressTrack.addEventListener("click", function (e) {
        if (!audio.duration) return;
        var rect = progressTrack.getBoundingClientRect();
        var pct = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pct * audio.duration;
      });

      audio.addEventListener("ended", function () {
        player.classList.remove("playing");
        iconPath.setAttribute("d", "M8 5v14l11-7z");
        statusEl.textContent = "Finished";
        progressFill.style.width = "100%";
      });

      function fmt(sec) {
        if (isNaN(sec)) return "0:00";
        var m = Math.floor(sec / 60);
        var s = Math.floor(sec % 60);
        return m + ":" + (s < 10 ? "0" : "") + s;
      }
    </script>
  </body>
</html>
