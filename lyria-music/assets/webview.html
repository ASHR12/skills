<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyria Music Player</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap"
    />
    <style>
      :root {
        --amber: #f59e0b;
        --amber-light: #fbbf24;
        --amber-glow: rgba(245, 158, 11, 0.25);
        --surface: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.08);
        --text: #fafaf9;
        --text-dim: #a8a29e;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: linear-gradient(160deg, #1c1917 0%, #0c0a09 50%, #1a0f00 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--text);
        overflow: hidden;
      }
      .player {
        width: 360px;
        background: var(--surface);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 32px 28px 28px;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: slideUp 0.6s ease-out;
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .viz {
        width: 100%;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        margin-bottom: 24px;
        opacity: 0.4;
        transition: opacity 0.4s;
      }
      .playing .viz { opacity: 1; }
      .viz-bar {
        width: 4px;
        border-radius: 2px;
        background: var(--amber);
        height: 8px;
      }
      .playing .viz-bar {
        animation: vizBounce 0.8s ease-in-out infinite alternate;
      }
      @keyframes vizBounce {
        0% { height: 8px; opacity: 0.4; }
        100% { height: var(--bar-h, 60px); opacity: 1; }
      }
      .info {
        text-align: center;
        margin-bottom: 20px;
        width: 100%;
      }
      .info h1 {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.3;
        margin-bottom: 6px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .info .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 500;
        color: var(--amber);
        background: var(--amber-glow);
        padding: 3px 10px;
        border-radius: 20px;
        letter-spacing: 0.5px;
      }
      .lyrics-box {
        width: 100%;
        max-height: 100px;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.6;
        color: var(--text-dim);
        background: rgba(0, 0, 0, 0.2);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 20px;
        white-space: pre-wrap;
        scrollbar-width: thin;
        scrollbar-color: var(--amber) transparent;
      }
      .lyrics-box:empty { display: none; }
      .progress-wrap { width: 100%; margin-bottom: 20px; }
      .progress-track {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 3px;
        cursor: pointer;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--amber), var(--amber-light));
        border-radius: 3px;
        transition: width 0.15s linear;
      }
      .time-row {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text-dim);
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .btn-play {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--amber);
        border: none;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        box-shadow: 0 8px 24px var(--amber-glow);
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .btn-play:hover {
        transform: scale(1.06);
        box-shadow: 0 12px 32px var(--amber-glow);
      }
      .btn-play:active { transform: scale(0.94); }
      .btn-play svg { fill: #1c1917; width: 26px; height: 26px; }
      .btn-play.disabled { opacity: 0.3; pointer-events: none; }
      .btn-download {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border);
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
      }
      .btn-download:hover { background: rgba(255, 255, 255, 0.14); transform: scale(1.06); }
      .btn-download:active { transform: scale(0.94); }
      .btn-download svg { fill: var(--text-dim); width: 20px; height: 20px; }
      .btn-download.disabled { opacity: 0.3; pointer-events: none; }
      .status-msg {
        text-align: center;
        font-size: 13px;
        color: var(--text-dim);
        margin-top: 16px;
      }
      .status-msg.error { color: #ef4444; }
    </style>
  </head>
  <body>
    <div class="player" id="player">
      <div class="viz" id="viz"></div>
      <div class="info">
        <h1 id="title">Loading...</h1>
        <span class="badge">LYRIA 3 CLIP &middot; 30s</span>
      </div>
      <div class="lyrics-box" id="lyrics"></div>
      <div class="progress-wrap">
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="time-row">
          <span id="cur-time">0:00</span>
          <span id="tot-time">0:30</span>
        </div>
      </div>
      <div class="controls">
        <button class="btn-download disabled" id="btn-download" title="Download MP3">
          <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18v12.17l3.59-3.58L17 12l-5 5-5-5 1.41-1.41L12 14.17V2z"/></svg>
        </button>
        <button class="btn-play disabled" id="btn-play">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" id="icon-path" /></svg>
        </button>
      </div>
      <div class="status-msg" id="status">Loading audio...</div>
    </div>
    <audio id="audio"></audio>
    <script>
      var params = new URLSearchParams(window.location.search);
      var promptText = params.get("prompt") || "Generated Clip";
      var lyricsText = params.get("lyrics") || "";

      var player = document.getElementById("player");
      var titleEl = document.getElementById("title");
      var lyricsEl = document.getElementById("lyrics");
      var statusEl = document.getElementById("status");
      var playBtn = document.getElementById("btn-play");
      var iconPath = document.getElementById("icon-path");
      var audio = document.getElementById("audio");
      var progressTrack = document.getElementById("progress-track");
      var progressFill = document.getElementById("progress-fill");
      var curTimeEl = document.getElementById("cur-time");
      var totTimeEl = document.getElementById("tot-time");
      var vizContainer = document.getElementById("viz");

      for (var i = 0; i < 40; i++) {
        var bar = document.createElement("div");
        bar.className = "viz-bar";
        bar.style.setProperty("--bar-h", (12 + Math.random() * 52) + "px");
        bar.style.animationDelay = (Math.random() * 0.6).toFixed(2) + "s";
        bar.style.animationDuration = (0.5 + Math.random() * 0.5).toFixed(2) + "s";
        vizContainer.appendChild(bar);
      }

      titleEl.textContent = promptText.length > 80
        ? promptText.substring(0, 77) + "..."
        : promptText;

      if (lyricsText) {
        lyricsEl.textContent = lyricsText;
      }

      // Read audio from URL hash: format is MIME_TYPE|BASE64_AUDIO_DATA
      var downloadBtn = document.getElementById("btn-download");
      var audioDataUri = "";

      var rawHash = window.location.hash.substring(1);
      if (rawHash) {
        var pipeIdx = rawHash.indexOf("|");
        if (pipeIdx > 0) {
          var mime = decodeURIComponent(rawHash.substring(0, pipeIdx));
          var b64 = rawHash.substring(pipeIdx + 1);
          audioDataUri = "data:" + mime + ";base64," + b64;
          audio.src = audioDataUri;
          playBtn.classList.remove("disabled");
          downloadBtn.classList.remove("disabled");
          statusEl.textContent = "Ready \u2014 tap play to listen";
        } else {
          statusEl.textContent = "Audio data format error.";
          statusEl.classList.add("error");
        }
      } else {
        statusEl.textContent = "No audio data received.";
        statusEl.classList.add("error");
      }

      downloadBtn.addEventListener("click", function () {
        if (!audioDataUri) return;
        var a = document.createElement("a");
        a.href = audioDataUri;
        a.download = "lyria-clip-" + Date.now() + ".mp3";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });

      playBtn.addEventListener("click", function () {
        if (audio.paused) {
          audio.play().then(function () {
            player.classList.add("playing");
            iconPath.setAttribute("d", "M6 19h4V5H6v14zm8-14v14h4V5h-4z");
            statusEl.textContent = "Now Playing";
            statusEl.classList.remove("error");
          }).catch(function () {
            statusEl.textContent = "Playback error";
            statusEl.classList.add("error");
          });
        } else {
          audio.pause();
          player.classList.remove("playing");
          iconPath.setAttribute("d", "M8 5v14l11-7z");
          statusEl.textContent = "Paused";
        }
      });

      audio.addEventListener("timeupdate", function () {
        if (!audio.duration) return;
        progressFill.style.width = ((audio.currentTime / audio.duration) * 100) + "%";
        curTimeEl.textContent = fmt(audio.currentTime);
      });

      audio.addEventListener("loadedmetadata", function () {
        totTimeEl.textContent = fmt(audio.duration);
      });

      progressTrack.addEventListener("click", function (e) {
        if (!audio.duration) return;
        var rect = progressTrack.getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
      });

      audio.addEventListener("ended", function () {
        player.classList.remove("playing");
        iconPath.setAttribute("d", "M8 5v14l11-7z");
        statusEl.textContent = "Finished";
        progressFill.style.width = "100%";
      });

      function fmt(sec) {
        if (isNaN(sec)) return "0:00";
        var m = Math.floor(sec / 60);
        var s = Math.floor(sec % 60);
        return m + ":" + (s < 10 ? "0" : "") + s;
      }
    </script>
  </body>
</html>
