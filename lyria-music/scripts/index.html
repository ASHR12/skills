<!doctype html>
<html lang="en">
  <body>
    <script>
      window["ai_edge_gallery_get_result"] = async (data, secret) => {
        try {
          const jsonData = JSON.parse(data);
          const prompt = jsonData.prompt || "A cheerful acoustic folk song with guitar";

          const apiKey = secret || "";
          if (!apiKey) {
            return JSON.stringify({
              error: "Missing Gemini API key. Please set your API key in the skill settings.",
            });
          }

          const url =
            "https://generativelanguage.googleapis.com/v1beta/models/lyria-3-clip-preview:generateContent?key=" +
            encodeURIComponent(apiKey);

          const requestBody = {
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseModalities: ["AUDIO", "TEXT"],
            },
          };

          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody),
          });

          if (!response.ok) {
            const errBody = await response.text();
            let msg = "API error " + response.status;
            try {
              const errJson = JSON.parse(errBody);
              if (errJson.error && errJson.error.message) msg = errJson.error.message;
            } catch (_) {}
            throw new Error(msg);
          }

          const result = await response.json();

          if (!result.candidates || result.candidates.length === 0) {
            throw new Error("No response from Lyria 3. The prompt may have been filtered by safety checks.");
          }

          let lyrics = "";
          let audioBase64 = "";
          let audioMime = "audio/mp3";

          for (const part of result.candidates[0].content.parts) {
            if (part.text) {
              lyrics += part.text + "\n";
            } else if (part.inlineData) {
              audioBase64 = part.inlineData.data;
              audioMime = part.inlineData.mimeType || "audio/mp3";
            }
          }

          if (!audioBase64) {
            throw new Error("No audio was generated. Try rephrasing your prompt.");
          }

          try {
            localStorage.setItem("lyria_audio", audioBase64);
            localStorage.setItem("lyria_mime", audioMime);
            localStorage.setItem("lyria_lyrics", lyrics.trim());
          } catch (storageErr) {
            console.warn("localStorage write failed, falling back to URL param", storageErr);
          }

          const params = new URLSearchParams();
          params.set("prompt", prompt.substring(0, 120));
          params.set("t", Date.now().toString());
          if (lyrics.trim()) {
            params.set("lyrics", lyrics.trim().substring(0, 600));
          }

          const resultText = lyrics.trim()
            ? "Music generated! Here are the lyrics:\n" + lyrics.trim()
            : "Music clip generated! Tap the preview card to listen.";

          return JSON.stringify({
            webview: {
              url: "webview.html?" + params.toString(),
              aspectRatio: 1.5,
            },
            result: resultText,
          });
        } catch (e) {
          console.error(e);
          return JSON.stringify({ error: "Music generation failed: " + e.message });
        }
      };
    </script>

    <!-- Test UI -->
    <div
      style="
        margin: 20px;
        padding: 20px;
        border: 1px solid #ccc;
        background: #fff;
        font-family: sans-serif;
        color: #333;
      "
    >
      <h3>Lyria Music - Local Test</h3>
      <input
        id="test-prompt"
        value="A cheerful acoustic folk song with guitar and harmonica"
        style="width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box"
      />
      <button id="run-test" style="padding: 10px 20px; font-size: 16px; cursor: pointer">
        Generate
      </button>
      <pre
        id="test-output"
        style="
          margin-top: 15px;
          padding: 10px;
          background: #f4f4f4;
          border: 1px solid #ddd;
          white-space: pre-wrap;
          font-size: 13px;
        "
      ></pre>
    </div>

    <script>
      document.getElementById("run-test").addEventListener("click", async () => {
        const output = document.getElementById("test-output");
        const prompt = document.getElementById("test-prompt").value;
        output.textContent = "Generating music... (this may take 15-30 seconds)";
        try {
          const payload = JSON.stringify({ prompt });
          const result = await window["ai_edge_gallery_get_result"](payload);
          output.textContent = result;
        } catch (e) {
          output.textContent = "Error: " + e.message;
        }
      });
    </script>
  </body>
</html>
